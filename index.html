<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grådig — Kommer snart</title>
  <meta name="description" content="Grådig — nordisk brasserie. Kaffe, brunch, frokost og middag. Vi åbner snart.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fdf3ea">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="Grådig — Kommer snart">
  <meta property="og:description" content="Dit nye stamsted. Nordisk brasserie — vi åbner snart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/img/bord-flash.jpg?v=2">
  <style>
    :root {
      --persimmon: #fe5d34;
      --plum: #533146;
      --plum-deep: #2e1a27;
      --caramel: #f4ba95;
      --paper: #fdf3ea;
      --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    html { overflow-x: clip; }
    body {
      min-height: 100svh;
      display: flex; flex-direction: column;
      background: var(--paper);
      color: var(--plum-deep);
      font: 400 12px/1.5 var(--mono);
      letter-spacing: .04em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--persimmon); outline-offset: 3px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* Lettering, recoloured via mask */
    .mark {
      display: block;
      background: currentColor;
      -webkit-mask: var(--src) center / contain no-repeat;
      mask: var(--src) center / contain no-repeat;
    }

    .top, .foot {
      width: min(100% - 32px, 1240px);
      margin-inline: auto;
      display: flex; flex-wrap: wrap; gap: 8px 24px;
      align-items: center; justify-content: space-between;
    }
    .top { padding: 20px 0; }
    .foot {
      padding: 18px 0 24px;
      border-top: 1px solid color-mix(in srgb, var(--plum-deep) 22%, transparent);
    }
    .foot a { border-bottom: 1px solid currentColor; }
    .foot a:hover { color: var(--persimmon); }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--persimmon); margin-right: 10px; vertical-align: 1px; }

    .poster {
      flex: 1;
      width: min(100% - 32px, 1240px);
      margin: 0 auto;
      padding: clamp(8px, 2vw, 24px) 0 clamp(32px, 4vw, 48px);
      display: grid;
      justify-items: center;
      position: relative;
    }

    .snap {
      position: relative; z-index: 1;
      margin: 0;
      width: min(90vw, 700px, calc(100svh - 258px));
      min-width: 260px;
      aspect-ratio: 1 / 1;
      background: var(--plum-deep);
      rotate: -2deg;
    }
    @media (max-width: 600px) { .snap { aspect-ratio: 4 / 5; } }
    .snap img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
    .snap::after {
      content: ""; position: absolute; inset: 0;
      /* darken the centre for the logo and the bottom where "kommer snart" overlaps */
      background:
        linear-gradient(180deg, rgba(46, 26, 39, 0) 60%, rgba(46, 26, 39, .22) 82%, rgba(46, 26, 39, .38) 100%),
        radial-gradient(70% 45% at 50% 50%, rgba(46, 26, 39, .5), rgba(46, 26, 39, .12) 75%);
    }
    .brand {
      --src: url(/img/logo-script.svg?v=3);
      position: absolute; z-index: 1;
      left: 50%; top: 50%;
      width: 64%;
      aspect-ratio: 1664 / 608;
      translate: -45.9% -50%; /* optical centre: the letters sit 4.1% left of the box centre */
      rotate: -4deg;
      color: var(--paper);
    }
    .snap figcaption {
      position: absolute; z-index: 1; top: 14px; right: -10px;
      background: var(--paper);
      padding: 6px 10px;
      rotate: 4deg;
      border: 1px solid var(--plum-deep);
    }

    .soon-wrap {
      position: relative; z-index: 2;
      margin-top: calc(min(96vw, 980px) * -.2);
    }
    .soon {
      --src: url(/img/kommer-snart.svg?v=3);
      width: min(96vw, 980px);
      aspect-ratio: 1794 / 398;
      color: var(--persimmon);
    }

    .tag { margin: clamp(16px, 2vw, 24px) 0 0; text-align: center; }

    @media (prefers-reduced-motion: no-preference) {
      .snap, .soon-wrap, .tag { animation: rise .9s var(--ease) both; }
      .brand { animation: pop 1s var(--ease) .35s both; }
      @keyframes pop { from { opacity: 0; scale: .92; } }
      .soon-wrap { animation-delay: .2s; }
      .soon { animation: write 1.4s var(--ease) .2s both; }
      .tag { animation-delay: .35s; }
      @keyframes rise { from { opacity: 0; translate: 0 24px; } }
      @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    }
  </style>
</head>
<body>
  <header class="top">
    <span>Nordisk brasserie</span>
    <span><i class="dot" aria-hidden="true"></i>Åbner snart</span>
  </header>

  <main class="poster">
    <h1 class="sr">Grådig — kommer snart</h1>
    <figure class="snap">
      <!-- Foto: Andrew Amelianovich, Unsplash (Unsplash License) — unsplash.com/photos/DRTqdLhJe9E -->
      <img src="/img/bord-flash.jpg?v=2" alt="Træbord med retter, vin og stearinlys fotograferet med flash" width="1400" height="1867">
      <span class="brand mark" aria-hidden="true"></span>
      <figcaption>Dit nye stamsted</figcaption>
    </figure>
    <div class="soon-wrap" aria-hidden="true"><span class="soon mark"></span></div>
    <p class="tag">Kaffe · Brunch · Frokost · Middag</p>
  </main>

  <footer class="foot">
    <span>© Grådig</span>
    <a href="mailto:info@graadig.dk">info@graadig.dk</a>
  </footer>
</body>
</html>
