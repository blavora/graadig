<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRÅDIG — Kommer snart</title>
  <meta name="description" content="GRÅDIG — nordisk brasserie. Kaffe, brunch, frokost og middag. Vi åbner snart.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ebe9e4">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="GRÅDIG — Kommer snart">
  <meta property="og:description" content="Dit nye stamsted. Nordisk brasserie — vi åbner snart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ebe9e4;
      --ink: #3a3835;
      --cream: #f4eee6;
      --fs: min(21.5vw, 280px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    html { overflow-x: clip; }
    body {
      background: var(--paper);
      color: var(--ink);
      font: 500 15px/1.5 "Manrope", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .poster {
      width: min(100%, 1240px);
      margin-inline: auto;
      padding-top: clamp(16px, 4vw, 48px);
      flex: 1;
    }

    .words {
      margin: 0;
      font: 400 var(--fs)/.8 "Permanent Marker", "Marker Felt", cursive;
      text-align: center;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
      pointer-events: none;
      white-space: nowrap;
    }
    .words span { display: block; }
    .words span:nth-child(1) { transform: rotate(-1.5deg) translateX(-1%); }
    .words span:nth-child(2) { transform: rotate(1deg) translateX(2%); }
    .words.bottom span:nth-child(1) { transform: rotate(1deg) translateX(1%); }
    .words.bottom span:nth-child(2) { transform: rotate(-1.5deg) translateX(-2%); }

    .photo {
      position: relative;
      z-index: 1;
      width: min(82%, 980px);
      margin: calc(var(--fs) * -.34) auto calc(var(--fs) * -.3);
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #6e5440;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 58%;
      display: block;
      filter: saturate(.85) contrast(.95);
    }
    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(30, 20, 14, .38), rgba(30, 20, 14, .12) 70%);
    }
    .tag {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      margin: 0;
      color: var(--cream);
      font-size: clamp(13px, 2.2vw, 22px);
      letter-spacing: .04em;
      line-height: 1.3;
      text-align: center;
      text-transform: uppercase;
      font-weight: 600;
      text-shadow: 0 1px 14px rgba(0, 0, 0, .5);
    }

    @media (max-width: 640px) {
      :root { --fs: 22vw; }
      .poster { padding-top: 24px; }
      .photo { width: 86%; aspect-ratio: 4 / 5; }
      .tag { font-size: 15px; }
    }

    .foot {
      width: min(100% - 32px, 1240px);
      margin: clamp(32px, 6vw, 72px) auto 0;
      padding: 20px 0 28px;
      border-top: 1px solid rgba(58, 56, 53, .2);
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .logo {
      width: 108px;
      aspect-ratio: 1324 / 520;
      background: var(--ink);
      -webkit-mask: url(/img/logo.svg) center / contain no-repeat;
      mask: url(/img/logo.svg) center / contain no-repeat;
    }
    .foot a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }
    .foot a:hover { opacity: .7; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    @media (prefers-reduced-motion: no-preference) {
      .words span, .photo { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
      .words.top span:nth-child(2) { animation-delay: .08s; }
      .photo { animation-delay: .16s; }
      .words.bottom span:nth-child(1) { animation-delay: .24s; }
      .words.bottom span:nth-child(2) { animation-delay: .32s; }
      @keyframes rise { from { opacity: 0; translate: 0 24px; } }
    }
  </style>
</head>
<body>
  <main class="poster">
    <h1 class="words top" aria-label="GRÅDIG kommer snart"><span>Kommer</span><span>snart</span></h1>
    <figure class="photo">
      <img src="/img/kaffe.jpg" alt="" width="960" height="1200">
      <p class="tag">Dit nye<br>stamsted</p>
    </figure>
    <div class="words bottom" aria-hidden="true"><span>Kommer</span><span>snart</span></div>
  </main>

  <footer class="foot">
    <div class="logo" role="img" aria-label="GRÅDIG"></div>
    <span>Nordisk brasserie · Åbner snart</span>
    <a href="mailto:info@graadig.dk">info@graadig.dk</a>
  </footer>
</body>
</html>
